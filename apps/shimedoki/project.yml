name: Shimedoki
options:
  bundleIdPrefix: com.mankai.shimedoki
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: "R7B3AEZ7TA"
    INFOPLIST_KEY_CFBundleDisplayName: "しめどき"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
schemes:
  Shimedoki:
    build:
      targets:
        Shimedoki: all
        ShimedokiWatch: all
        ShimedokiWidget: all
        ShimedokiWatchWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShimedokiTests
    profile:
      config: Release
    archive:
      config: Release
targets:
  Shimedoki:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    deviceFamilies: [iphone]
    sources:
      - path: Shimedoki
      - path: Shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "カレンダーの予定から自動でテンプレを提案します"
        INFOPLIST_KEY_NSSupportsLiveActivities: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Shimedoki/Shimedoki.entitlements
    resources:
      - path: Shimedoki/Resources
    entitlements:
      path: Shimedoki/Shimedoki.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mankai.shimedoki
    dependencies:
      - target: ShimedokiWidget
        embed: true

  ShimedokiWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShimedokiWidget
      - path: Shimedoki/LiveActivity
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: ShimedokiWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.mankai.shimedoki.Shimedoki.widget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: ShimedokiWidget/ShimedokiWidget.entitlements
    entitlements:
      path: ShimedokiWidget/ShimedokiWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mankai.shimedoki

  ShimedokiWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ShimedokiWatch
      - path: Shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.mankai.shimedoki
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: ShimedokiWatch/ShimedokiWatch.entitlements
    resources:
      - path: ShimedokiWatch/Resources
    entitlements:
      path: ShimedokiWatch/ShimedokiWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mankai.shimedoki
    dependencies:
      - target: ShimedokiWatchWidget
        embed: true

  ShimedokiWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ShimedokiWatchWidget
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: ShimedokiWatchWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.mankai.shimedoki.ShimedokiWatch.watchwidget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: ShimedokiWatchWidget/ShimedokiWatchWidget.entitlements
    entitlements:
      path: ShimedokiWatchWidget/ShimedokiWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mankai.shimedoki

  ShimedokiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShimedokiTests
      - path: Shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Shimedoki
