name: FileConverter
options:
  bundleIdPrefix: com.mankai.fileconverter
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "R7B3AEZ7TA"
    INFOPLIST_KEY_CFBundleDisplayName: "ファイル変換"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
targets:
  FileConverter:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: FileConverter
      - path: Shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportsDocumentBrowser: true
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "変換した画像を写真ライブラリに保存するために使用します"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: FileConverter/FileConverter.entitlements
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
    resources:
      - path: FileConverter/Resources
    entitlements:
      path: FileConverter/FileConverter.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
  FileConverterTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: FileConverterTests
      - path: Shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
      configs:
        debug:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FileConverter.app/Contents/MacOS/FileConverter"
    dependencies:
      - target: FileConverter
schemes:
  FileConverter:
    build:
      targets:
        FileConverter: all
        FileConverterTests: [test]
    test:
      targets:
        - FileConverterTests
